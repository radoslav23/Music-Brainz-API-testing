name: Run Postman API Tests (Newman)

on:
  workflow_dispatch:        # manual trigger
  push:
    branches: [ "main" ]    # run on push to main
  schedule:
    - cron: "0 0 * * *"     # run every day at 00:00 UTC (2 AM Bulgaria time)

jobs:
  postman-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        attempt: [1, 2, 3]
      fail-fast: false

    steps:
      - name: Wait before retry
        if: matrix.attempt != 1
        run: sleep 1800   # 30 minutes

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Check MusicBrainz availability
        id: health
        run: |
          STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            https://musicbrainz.org/ws/2/recording)
          if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ]; then
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - name: Run MusicBrainz Test Collection
        if: steps.health.outputs.available == 'true'
        run: |
          newman run \
            "https://api.postman.com/collections/4784767-81c74bdd-5f64-4631-b460-a74cf6fd5707?apikey=${{ secrets.POSTMAN_API_KEY }}" \
            --bail
