name: Run Postman API Tests (Newman)

on:
  workflow_dispatch:        # manual trigger
  push:
    branches: [ "main" ]    # run on push to main
  schedule:
    - cron: "0 0 * * *"     # run every day at 00:00 UTC (2 AM Bulgaria time)

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run with retry logic (3 attempts, 30 min delay)
        run: |
          for attempt in 1 2 3; do
            echo "===== Attempt $attempt ====="

            STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 20 \
              https://musicbrainz.org/ws/2/recording)

            if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ]; then
              echo "MusicBrainz unavailable (status $STATUS)"
            else
              echo "MusicBrainz available — running Newman..."
              newman run \
                "https://api.postman.com/collections/4784767-81c74bdd-5f64-4631-b460-a74cf6fd5707?apikey=${{ secrets.POSTMAN_API_KEY }}" \
                --bail
              echo "Tests succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 30 minutes before retry..."
              sleep 1800
            fi
          done

          echo "All attempts failed — MusicBrainz still unavailable."
          exit 1
